# ─── Ariadne's Thread [AT-0634] ─────────────────────
# What: Build and deploy seenshot.app on every push to main
# Why:  Production must ship from GitHub, not from a laptop wrangler login
# Date: 2026-09-06
# Related: [AT-0633] wrangler.jsonc:account_id, https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/, https://www.npmjs.com/package/@vinext/cloudflare
# ─────────────────────────────────────────────────────
name: Deploy seenshot.app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: seenshot-web-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          echo "SeenShot ci: npm ci start"
          npm ci
          echo "SeenShot ci: npm ci done"

      - name: Deploy Worker
        run: |
          echo "SeenShot ci: vinext-cloudflare deploy start"
          npx vinext-cloudflare deploy
          echo "SeenShot ci: vinext-cloudflare deploy done"

      - name: Verify production
        run: |
          echo "SeenShot ci: starting production smoke"
          attempt=1
          while [ "$attempt" -le 8 ]
          do
            echo "SeenShot ci: smoke attempt ${attempt}"
            code=$(curl -sS -o /tmp/seenshot-prod.html -w "%{http_code}" "https://seenshot.app/")
            echo "SeenShot ci: production status=${code}"
            if [ "$code" = "200" ]
            then
              if grep -q "SeenShot" /tmp/seenshot-prod.html
              then
                echo "SeenShot ci: production verify ok"
                exit 0
              fi
              echo "SeenShot ci: status 200 but SeenShot marker missing"
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "SeenShot ci: production verify failed"
          exit 1
