<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign In — SeenShot</title>
  <link rel="icon" href="/SeenShot.png">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <!-- ─── Ariadne's Thread [AT-0016] ─────────────────────
    What: Email/password form matching the Mac app account panel
    Why:  Same Firebase users as SeenShot for Mac
    Date: 2026-08-26
    Related: [AT-0010] public/js/signin.js, app→AccountSignInPanel.cpp
  ─────────────────────────────────────────────────────── -->
  <header class="topnav">
    <a class="brand" href="/"><img src="/SeenShot.png" alt="">SeenShot</a>
    <nav>
      <a id="nav-auth" href="/signin">Sign In</a>
    </nav>
  </header>
  <main class="page page-auth">
    <form class="auth-form card" action="#" method="post" onsubmit="return false">
      <h2 id="form-title">Sign In</h2>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="name@example.com">
      <label for="password">Password</label>
      <!-- ─── Ariadne's Thread [AT-0031] ─────────────────────
        What: Generate password button sits inside the password field
        Why:  Create account needs a 12-character random password in the same input
        Date: 2026-08-27
        Related: [AT-0010] public/js/signin.js:generatePassword, [AT-0028] public/js/signin.js:setMode
      ─────────────────────────────────────────────────────── -->
      <div class="password-field" id="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="none">
        <button class="generate-password" type="button" id="generate-password" hidden>Generate password</button>
        <!-- ─── Ariadne's Thread [AT-0032] ─────────────────────
          What: Eye button toggles password visibility
          Why:  The field stays type=password; Generate must not turn it into a text field
          Date: 2026-08-27
          Related: [AT-0031] public/js/signin.js:generatePassword, [AT-0010] public/js/signin.js:setPasswordVisible
        ─────────────────────────────────────────────────────── -->
        <button class="toggle-password" type="button" id="toggle-password" aria-label="Show password" aria-pressed="false">
          <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle>
          </svg>
          <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18"></path>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle>
          </svg>
        </button>
      </div>
      <!-- ─── Ariadne's Thread [AT-0025] ─────────────────────
        What: Forgot password sits under the password field
        Why:  It belongs to the password input, not the Create account row
        Date: 2026-08-27
        Related: [AT-0016] public/signin.html, [AT-0010] public/js/signin.js
      ─────────────────────────────────────────────────────── -->
      <button class="flat" type="button" id="forgot">Forgot password</button>
      <button class="download" type="button" id="primary">Sign In</button>
      <!-- ─── Ariadne's Thread [AT-0028] ─────────────────────
        What: Create account switches the same form into sign-up mode
        Why:  One Identity Toolkit form; create is not a second submit on Sign In
        Date: 2026-08-27
        Related: [AT-0010] public/js/signin.js:setMode, [AT-0008] public/js/auth.js:signUpEmail
      ─────────────────────────────────────────────────────── -->
      <button class="flat create-account" type="button" id="switch">Create account</button>
      <p id="status" class="meta"></p>
    </form>
  </main>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/signin.js"></script>
</body>
</html>
