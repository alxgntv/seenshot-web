<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign In — SeenShot</title>
  <link rel="icon" href="/SeenShot.png">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <!-- ─── Ariadne's Thread [AT-0016] ─────────────────────
    What: Email/password form matching the Mac app account panel
    Why:  Same Firebase users as SeenShot for Mac
    Date: 2026-08-26
    Related: [AT-0010] public/js/signin.js, app→AccountSignInPanel.cpp
  ─────────────────────────────────────────────────────── -->
  <header class="topnav">
    <a class="brand" href="/"><img src="/SeenShot.png" alt="">SeenShot</a>
    <nav>
      <a href="/cabinet">Cabinet</a>
      <a id="nav-auth" href="/signin">Sign In</a>
    </nav>
  </header>
  <main class="page">
    <form class="auth-form card" action="#" method="post" onsubmit="return false">
      <h2>Sign In</h2>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="name@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button class="download" type="button" id="sign-in">Sign In</button>
      <div class="auth-row">
        <button class="flat" type="button" id="create">Create account</button>
        <button class="flat" type="button" id="forgot">Forgot password</button>
      </div>
      <button class="flat" type="button" id="email-link">Email me a sign-in link</button>
      <p id="status" class="meta"></p>
    </form>
  </main>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/signin.js"></script>
</body>
</html>
