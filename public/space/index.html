<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>My Screenshots — SeenShot</title>
  <link rel="icon" href="/SeenShot.png">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <!-- ─── Ariadne's Thread [AT-0022] ─────────────────────
    What: Signed-in user space at /space/
    Why:  Each account's cloud screenshots live here, not at /cabinet
    Date: 2026-08-27
    Related: [AT-0011] public/js/cabinet.js, [AT-0023] public/cabinet.html
  ─────────────────────────────────────────────────────── -->
  <header class="topnav">
    <a class="brand" href="/"><img src="/SeenShot.png" alt="">SeenShot</a>
    <nav>
      <a id="nav-auth" href="/signin">Sign In</a>
      <!-- ─── Ariadne's Thread [AT-0033] ─────────────────────
        What: Sign Out lives in the top nav next to the email
        Why:  It was a yellow button in cabinet-head; header is where session actions sit
        Date: 2026-08-27
        Related: [AT-0009] public/js/nav.js:paint, [AT-0022] public/space/index.html
      ─────────────────────────────────────────────────────── -->
      <button class="sign-out" type="button" id="sign-out" hidden>Sign Out</button>
    </nav>
  </header>
  <main class="page">
    <div class="cabinet-head">
      <h1>My Screenshots</h1>
      <a id="latest-download" class="download" href="https://github.com/alxgntv/seenshot/releases" hidden>Download</a>
    </div>
    <!-- ─── Ariadne's Thread [AT-0036] ─────────────────────
      What: Empty state shows Download on the title row and the Cmd+Shift+2 hint below
      Why:  Title and Download sit on one line; hint stays under them
      Date: 2026-08-27
      Related: [AT-0035] public/space/index.html, [AT-0013] public/js/releases.js
    ─────────────────────────────────────────────────────── -->
    <div id="empty-wrap" class="empty-wrap" hidden>
      <p id="empty" class="empty">Create First Screen Shot Cmd + Shift + 2 and share it.</p>
    </div>
    <div id="feed" class="feed"></div>
  </main>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/cabinet.js"></script>
  <script src="/js/releases.js"></script>
</body>
</html>
